name: Go cache experiment

on:
  pull_request:
    paths:
      - .github/workflows/go-cache-experiment.yml
      - .github/actions/setup-go/**
      - .github/actions/trim-go-cache/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  seed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-go
        with:
          save: 'false'
          cache-name: ${{ runner.os == 'Windows' && 'test-windows' || 'test-linux' }}
      - if: runner.os == 'Windows'
        name: Exclude build paths from Defender
        continue-on-error: true
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, (go env GOROOT), (go env GOPATH), (go env GOCACHE), (go env GOMODCACHE))
          Add-MpPreference -ExclusionPath $paths
      - name: Test pruning helper
        run: node --test .github/actions/trim-go-cache/go-cache.test.mjs
      - id: paths
        shell: bash
        run: echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Save candidate cache after successful validation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.paths.outputs.build }}
          key: gobuild-v3-${{ runner.os }}-${{ runner.os == 'Windows' && 'test-windows' || 'test-linux' }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
      # Validate the same LIFO post-action ordering used by setup-go on main.
      - uses: $/.github/actions/trim-go-cache
        with:
          path: ${{ steps.paths.outputs.build }}
      - name: Warm packages and tests
        shell: bash
        env:
          TEST_OUTPUT: ${{ runner.os == 'Windows' && 'NUL' || '/dev/null' }}
        run: |
          go build ./...
          go test -c -o "$TEST_OUTPUT" ./...

  restore:
    needs: seed
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-go
        with:
          save: 'false'
          cache-name: ${{ runner.os == 'Windows' && 'test-windows' || 'test-linux' }}
      - if: runner.os == 'Windows'
        name: Exclude build paths from Defender
        continue-on-error: true
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, (go env GOROOT), (go env GOPATH), (go env GOCACHE), (go env GOMODCACHE))
          Add-MpPreference -ExclusionPath $paths
      - name: Restore exact candidate
        id: candidate
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && format('{0}\go-build', runner.temp) || '/home/runner/.cache/go-build' }}
          key: gobuild-v3-${{ runner.os }}-${{ runner.os == 'Windows' && 'test-windows' || 'test-linux' }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Require candidate hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.candidate.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: Inventory restored cache
        shell: bash
        run: node .github/actions/trim-go-cache/go-cache.mjs stats "$(go env GOCACHE)"
      - name: Simulate a source change
        shell: bash
        run: |
          printf '\n// Cache experiment: changed source on the next commit.\n' >> pkg/tui/tui.go
      - name: Build
        run: task build
      - name: Test
        run: task test-ci
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-cache-validation-${{ runner.os }}
          path: ${{ runner.temp }}/go-test.json
          retention-days: 3
